name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  create-resource-group:
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "## 📦 Resource Group Setup" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Check if resource group exists
            rgExists=$(az group exists --name ${{ vars.AZURE_RESOURCE_GROUP }})

            if [ "$rgExists" == "true" ]; then
              echo "✅ Resource group '${{ vars.AZURE_RESOURCE_GROUP }}' in '${{ vars.AZURE_LOCATION  }}' already exists" >> $GITHUB_STEP_SUMMARY
            else
              echo "🔨 Creating resource group '${{ vars.AZURE_RESOURCE_GROUP }}' in '${{ vars.AZURE_LOCATION  }}'..." >> $GITHUB_STEP_SUMMARY
              
              az group create \
                --name ${{ vars.AZURE_RESOURCE_GROUP }} \
                --location ${{ vars.AZURE_LOCATION  }}
              
              echo "✅ Resource group created successfully" >> $GITHUB_STEP_SUMMARY
            fi

  validate-infrastructure:
    runs-on: ubuntu-latest
    needs: create-resource-group

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Lint Bicep files
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "## 🔍 Bicep Linting Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            az bicep lint --file ./infra/main.bicep --diagnostics-format json > lint-results.json || true

            if [ -s lint-results.json ]; then
              echo "### Linting Output:" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              cat lint-results.json >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ No linting issues found." >> $GITHUB_STEP_SUMMARY
            fi

      - name: Validate Bicep template
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "## ✅ Template Validation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            validation=$(az deployment group validate \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --template-file ./infra/main.bicep \
              --parameters ./infra/main.bicepparam \
              --output json)

            validationState=$(echo "$validation" | jq -r '.properties.provisioningState')

            if [ "$validationState" == "Succeeded" ]; then
              echo "✅ Template validation passed successfully!" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Template validation failed!" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              echo "$validation" | jq '.properties.error' >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            fi

      - name: What-If Analysis
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "## 📊 What-If Analysis" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Preview of changes that will be made:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            az deployment group what-if \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --template-file ./infra/main.bicep \
              --parameters ./infra/main.bicepparam \
              --result-format ResourceIdOnly \
              --output json > whatif-results.json 2>&1 || true

            if [ -s whatif-results.json ] && jq -e . whatif-results.json >/dev/null 2>&1; then
              echo '```' >> $GITHUB_STEP_SUMMARY
              jq -r '.changes[]? | "[\(.changeType)] \(.resourceId)"' whatif-results.json >> $GITHUB_STEP_SUMMARY || echo "No changes detected" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo '```' >> $GITHUB_STEP_SUMMARY
              cat whatif-results.json >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi

  deploy-infrastructure:
    runs-on: ubuntu-latest
    needs: validate-infrastructure
    environment: validation-approval

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Access token for Graph
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "## 🔐 Acquiring Access Token for Microsoft Graph" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            accessToken=$(az account get-access-token --resource-type ms-graph --query accessToken --output tsv)

            if [ -n "$accessToken" ]; then
              echo "✅ Successfully acquired access token for Microsoft Graph." >> $GITHUB_STEP_SUMMARY
              echo "accessToken=$accessToken" >> $GITHUB_OUTPUT
            else
              echo "❌ Failed to acquire access token for Microsoft Graph." >> $GITHUB_STEP_SUMMARY
              exit 1
            fi

      - name: Deploy Bicep Infrastructure
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: ./infra/main.bicepparam
          failOnStdErr: false
          deploymentName: "infra-deploy-${{ github.run_number }}"

      - name: Get Deployment Outputs
        id: outputs
        uses: azure/cli@v2
        with:
          inlineScript: |
            outputs=$(az deployment group show \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --name infra-deploy-${{ github.run_number }} \
              --query properties.outputs \
              --output json)
            echo "Deployment outputs:"
            echo "$outputs" | jq '.'
            webAppUrl=$(echo "$outputs" | jq -r '.webAppUrl.value')
            echo "webAppUrl=$webAppUrl" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        run: |
          echo "## 🎉 Infrastructure Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Name:** infra-deploy-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Resource Group:** ${{ vars.AZURE_RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY
          echo "**Web App URL:** ${{ steps.outputs.outputs.webAppUrl }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All infrastructure resources have been deployed successfully." >> $GITHUB_STEP_SUMMARY
