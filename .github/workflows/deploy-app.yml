name: Deploy Application

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: ./app
        run: npm install

      - name: Run tests (if available)
        working-directory: ./app
        run: npm test --if-present

      - name: Create version.json
        working-directory: ./app
        run: |
          # Read version from package.json
          version=$(node -p "require('./package.json').version")
          buildDate=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          commit="${{ github.sha }}"

          # Create version.json in public directory
          cat > public/version.json <<EOF
          {
            "version": "$version",
            "buildDate": "$buildDate",
            "commit": "$commit"
          }
          EOF

          echo "✅ Created version.json with version $version" >> $GITHUB_STEP_SUMMARY

      - name: Create deployment package
        working-directory: ./app
        run: |
          # Create a zip file with the application
          zip -r ../app-deployment.zip . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x "*.md"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app-deployment.zip
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      app_name: ${{ steps.webapp.outputs.webAppName }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Web App Name
        id: webapp
        uses: azure/cli@v2
        with:
          inlineScript: |
            # Get the web app name from the resource group
            webAppName=$(az webapp list \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --query "[?contains(name, 'app-')].name | [0]" \
              --output tsv)

            if [ -z "$webAppName" ]; then
              echo "❌ Web App not found in resource group" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi

            echo "webAppName=$webAppName" >> $GITHUB_OUTPUT
            echo "## 🚀 Deploying to Web App" >> $GITHUB_STEP_SUMMARY
            echo "**Web App Name:** $webAppName" >> $GITHUB_STEP_SUMMARY
            echo "**Deployment Slot:** dev" >> $GITHUB_STEP_SUMMARY

      - name: Deploy to Azure Web App (dev slot)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.webapp.outputs.webAppName }}
          slot-name: dev
          package: app-deployment.zip

      - name: Restart Web App (dev slot)
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp restart \
              --name ${{ steps.webapp.outputs.webAppName }} \
              --slot dev \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}

            echo "✅ Web App dev slot restarted successfully" >> $GITHUB_STEP_SUMMARY

      - name: Get Web App Slot URL
        uses: azure/cli@v2
        with:
          inlineScript: |
            slotUrl=$(az webapp deployment slot list \
              --name ${{ steps.webapp.outputs.webAppName }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --query "[?name=='dev'].defaultHostName | [0]" \
              --output tsv)

            echo "## 🎉 Deployment Complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Deployment Slot:** dev" >> $GITHUB_STEP_SUMMARY
            echo "**Slot URL:** https://$slotUrl" >> $GITHUB_STEP_SUMMARY
            echo "**Version:** $(cd app && node -p "require('./package.json').version")" >> $GITHUB_STEP_SUMMARY
            echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Application deployed successfully to dev slot!" >> $GITHUB_STEP_SUMMARY

  swap-to-production:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production-swap # Requires manual approval
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Swap Deployment Slots
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "## 🔄 Swapping Deployment Slots" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Source Slot:** dev" >> $GITHUB_STEP_SUMMARY
            echo "**Target Slot:** production" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            az webapp deployment slot swap \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --name ${{ needs.deploy.outputs.app_name }} \
              --slot dev \
              --target-slot production

            echo "✅ Slot swap completed successfully!" >> $GITHUB_STEP_SUMMARY

      - name: Get Production URL
        uses: azure/cli@v2
        with:
          inlineScript: |
            prodUrl=$(az webapp show \
              --name ${{ needs.deploy.outputs.app_name }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --query "defaultHostName" \
              --output tsv)

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## 🎉 Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Production URL:** https://$prodUrl" >> $GITHUB_STEP_SUMMARY
            echo "**Deployed From:** dev slot" >> $GITHUB_STEP_SUMMARY
            echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Application is now live in production!" >> $GITHUB_STEP_SUMMARY
