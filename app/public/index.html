<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagicFiles - File Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0078d4;
            --primary-dark: #005a9e;
            --success: #107c10;
            --danger: #d13438;
            --warning: #ff8c00;
            --bg-primary: #ffffff;
            --bg-secondary: #f3f2f1;
            --bg-hover: #e1dfdd;
            --text-primary: #323130;
            --text-secondary: #605e5c;
            --border: #d2d0ce;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg-primary);
            border-radius: 16px;
            box-shadow: 0 8px 32px var(--shadow);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 32px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 32px;
        }

        .upload-section {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 32px;
            margin-bottom: 32px;
            border: 2px dashed var(--border);
            transition: all 0.3s ease;
        }

        .upload-section.drag-over {
            border-color: var(--primary);
            background: #e8f4fd;
            transform: scale(1.02);
        }

        .upload-area {
            text-align: center;
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            color: var(--primary);
        }

        .upload-area h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .upload-area p {
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }

        .file-input {
            display: none;
        }

        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 120, 212, 0.3);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .btn-danger:hover {
            background: #a4262c;
        }

        .btn-success {
            background: var(--success);
            color: white;
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .btn-success:hover {
            background: #0b5a0b;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .files-section {
            margin-top: 32px;
        }

        .files-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .files-header h2 {
            font-size: 1.8rem;
            color: var(--text-primary);
        }

        .files-header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .view-toggle {
            display: flex;
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 4px;
        }

        .view-toggle-btn {
            background: transparent;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .view-toggle-btn:hover {
            background: var(--bg-hover);
        }

        .view-toggle-btn.active {
            background: var(--primary);
            color: white;
        }

        .refresh-btn {
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .refresh-btn:hover {
            background: var(--bg-hover);
        }

        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .files-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-primary);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .files-table thead {
            background: var(--bg-secondary);
        }

        .files-table th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border);
        }

        .files-table td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
        }

        .files-table tbody tr {
            transition: background 0.2s ease;
        }

        .files-table tbody tr:hover {
            background: var(--bg-secondary);
        }

        .files-table tbody tr:last-child td {
            border-bottom: none;
        }

        .files-table .file-icon {
            font-size: 1.5rem;
        }

        .files-table .file-name {
            font-weight: 600;
        }

        .files-table .file-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .files-table .file-actions .btn {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .file-card {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-card:hover {
            box-shadow: 0 4px 16px var(--shadow);
            transform: translateY(-4px);
        }

        .file-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
            color: var(--primary);
        }

        .file-name {
            font-weight: 600;
            margin-bottom: 8px;
            word-break: break-word;
            color: var(--text-primary);
        }

        .file-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .file-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .file-actions .btn {
            flex: 1;
        }

        .status-message {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .status-message.show {
            display: block;
        }

        .status-success {
            background: #dff6dd;
            border: 1px solid var(--success);
            color: var(--success);
        }

        .status-error {
            background: #fde7e9;
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .status-info {
            background: #e8f4fd;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid var(--bg-secondary);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .content {
                padding: 20px;
            }

            .upload-section {
                padding: 24px;
            }

            .files-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🗂️ MagicFiles</h1>
            <p>Your secure cloud file manager</p>
        </div>

        <div class="content">
            <div id="statusMessage" class="status-message"></div>

            <div class="upload-section" id="uploadSection">
                <div class="upload-area">
                    <div class="upload-icon">📤</div>
                    <h2>Upload Files</h2>
                    <p>Drag and drop your files here, or click to browse</p>
                    <div class="file-input-wrapper">
                        <input type="file" id="fileInput" class="file-input" />
                        <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                            Choose File
                        </button>
                    </div>
                </div>
            </div>

            <div class="files-section">
                <div class="files-header">
                    <h2>My Files</h2>
                    <div class="files-header-actions">
                        <div class="view-toggle">
                            <button class="view-toggle-btn active" id="gridViewBtn" onclick="toggleView('grid')"
                                title="Grid View">
                                ▦
                            </button>
                            <button class="view-toggle-btn" id="tableViewBtn" onclick="toggleView('table')"
                                title="Table View">
                                ☰
                            </button>
                        </div>
                        <button class="btn refresh-btn" onclick="loadFiles()">🔄 Refresh</button>
                    </div>
                </div>

                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p>Loading files...</p>
                </div>

                <div id="filesGrid" class="files-grid"></div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let files = [];
        let MAX_FILE_SIZE = 100 * 1024 * 1024; // Default 100MB in bytes
        let MAX_FILE_SIZE_MB = 100; // Default 100MB
        let currentView = 'grid'; // 'grid' or 'table'

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadConfig();
            loadFiles();
            setupEventListeners();
        });

        // Load configuration from server
        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();
                if (response.ok) {
                    MAX_FILE_SIZE = config.maxFileSizeBytes;
                    MAX_FILE_SIZE_MB = config.maxFileSizeMB;
                    updateMaxFileSizeDisplay();
                }
            } catch (error) {
                console.error('Error loading config:', error);
            }
        }

        // Update max file size display in UI
        function updateMaxFileSizeDisplay() {
            const uploadSection = document.querySelector('.upload-area p');
            if (uploadSection) {
                uploadSection.innerHTML = `Drag and drop your files here, or click to browse<br><small style="color: #605e5c; font-size: 0.9em;">(Maximum file size: ${MAX_FILE_SIZE_MB}MB)</small>`;
            }
        }

        // Setup event listeners
        function setupEventListeners() {
            const fileInput = document.getElementById('fileInput');
            const uploadSection = document.getElementById('uploadSection');

            fileInput.addEventListener('change', handleFileSelect);

            // Drag and drop
            uploadSection.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadSection.classList.add('drag-over');
            });

            uploadSection.addEventListener('dragleave', () => {
                uploadSection.classList.remove('drag-over');
            });

            uploadSection.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadSection.classList.remove('drag-over');

                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    uploadFile(files[0]);
                }
            });
        }

        // Load files from server
        async function loadFiles() {
            showLoading(true);
            hideStatus();

            try {
                const response = await fetch('/api/files');
                const data = await response.json();

                if (response.ok) {
                    files = data.files;
                    renderFiles();
                } else {
                    showStatus('Failed to load files: ' + data.message, 'error');
                }
            } catch (error) {
                showStatus('Error loading files: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        // Toggle view between grid and table
        function toggleView(view) {
            currentView = view;
            document.getElementById('gridViewBtn').classList.toggle('active', view === 'grid');
            document.getElementById('tableViewBtn').classList.toggle('active', view === 'table');
            renderFiles();
        }

        // Render files
        function renderFiles() {
            const filesContainer = document.getElementById('filesGrid');

            if (files.length === 0) {
                filesContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📂</div>
                        <h3>No files yet</h3>
                        <p>Upload your first file to get started</p>
                    </div>
                `;
                return;
            }

            if (currentView === 'grid') {
                renderGridView(filesContainer);
            } else {
                renderTableView(filesContainer);
            }
        }

        // Render grid view
        function renderGridView(container) {
            container.className = 'files-grid';
            container.innerHTML = files.map(file => `
                <div class="file-card">
                    <div class="file-icon">${getFileIcon(file.name)}</div>
                    <div class="file-name">${getDisplayName(file.name)}</div>
                    <div class="file-meta">Size: ${formatBytes(file.size)}</div>
                    <div class="file-meta">Modified: ${formatDate(file.lastModified)}</div>
                    <div class="file-actions">
                        <button class="btn btn-success" onclick="downloadFile('${escapeHtml(file.name)}')">
                            ⬇️ Download
                        </button>
                        <button class="btn btn-danger" onclick="deleteFile('${escapeHtml(file.name)}')">
                            🗑️ Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Render table view
        function renderTableView(container) {
            container.className = '';
            container.innerHTML = `
                <table class="files-table">
                    <thead>
                        <tr>
                            <th style="width: 50px;"></th>
                            <th>Name</th>
                            <th style="width: 120px;">Size</th>
                            <th style="width: 180px;">Modified</th>
                            <th style="width: 180px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${files.map(file => `
                            <tr>
                                <td><span class="file-icon">${getFileIcon(file.name)}</span></td>
                                <td><span class="file-name">${getDisplayName(file.name)}</span></td>
                                <td>${formatBytes(file.size)}</td>
                                <td>${formatDate(file.lastModified)}</td>
                                <td>
                                    <div class="file-actions">
                                        <button class="btn btn-success" onclick="downloadFile('${escapeHtml(file.name)}')">
                                            ⬇️ Download
                                        </button>
                                        <button class="btn btn-danger" onclick="deleteFile('${escapeHtml(file.name)}')">
                                            🗑️ Delete
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // Handle file selection
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                uploadFile(file);
            }
        }

        // Upload file
        async function uploadFile(file) {
            if (!file) return;

            // Check file size before uploading
            if (file.size > MAX_FILE_SIZE) {
                showStatus(
                    `File "${file.name}" is too large (${formatBytes(file.size)}). Maximum size is ${MAX_FILE_SIZE_MB}MB.`,
                    'error'
                );
                document.getElementById('fileInput').value = '';
                return;
            }

            showStatus('Uploading ' + file.name + '...', 'info');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus('File uploaded successfully!', 'success');
                    document.getElementById('fileInput').value = '';
                    loadFiles();
                } else {
                    showStatus('Upload failed: ' + data.message, 'error');
                }
            } catch (error) {
                showStatus('Error uploading file: ' + error.message, 'error');
            }
        }

        // Download file
        async function downloadFile(filename) {
            try {
                window.location.href = `/api/download/${encodeURIComponent(filename)}`;
                showStatus('Downloading ' + getDisplayName(filename), 'success');
            } catch (error) {
                showStatus('Error downloading file: ' + error.message, 'error');
            }
        }

        // Delete file
        async function deleteFile(filename) {
            if (!confirm('Are you sure you want to delete ' + getDisplayName(filename) + '?')) {
                return;
            }

            showStatus('Deleting file...', 'info');

            try {
                const response = await fetch(`/api/files/${encodeURIComponent(filename)}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus('File deleted successfully!', 'success');
                    loadFiles();
                } else {
                    showStatus('Delete failed: ' + data.message, 'error');
                }
            } catch (error) {
                showStatus('Error deleting file: ' + error.message, 'error');
            }
        }

        // Utility functions
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message status-${type} show`;

            setTimeout(() => {
                hideStatus();
            }, 5000);
        }

        function hideStatus() {
            const statusEl = document.getElementById('statusMessage');
            statusEl.classList.remove('show');
        }

        function showLoading(show) {
            const loadingEl = document.getElementById('loading');
            if (show) {
                loadingEl.classList.add('show');
            } else {
                loadingEl.classList.remove('show');
            }
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                'pdf': '📕',
                'doc': '📘',
                'docx': '📘',
                'xls': '📗',
                'xlsx': '📗',
                'ppt': '📙',
                'pptx': '📙',
                'jpg': '🖼️',
                'jpeg': '🖼️',
                'png': '🖼️',
                'gif': '🖼️',
                'zip': '🗜️',
                'rar': '🗜️',
                'mp3': '🎵',
                'mp4': '🎬',
                'txt': '📄',
                'csv': '📊'
            };
            return icons[ext] || '📄';
        }

        function getDisplayName(filename) {
            // Remove timestamp prefix if present
            const match = filename.match(/^\d+-(.+)$/);
            return match ? match[1] : filename;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>

</html>
