<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagicFiles - File Manager</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-light: #3b82f6;
            --accent: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --bg-hover: #e2e8f0;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow: rgba(15, 23, 42, 0.08);
            --shadow-md: rgba(15, 23, 42, 0.12);
            --shadow-lg: rgba(15, 23, 42, 0.16);
        }

        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --accent: #a78bfa;
            --success: #34d399;
            --danger: #f87171;
            --warning: #fbbf24;
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --bg-hover: #475569;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border: #334155;
            --border-light: #475569;
            --shadow: rgba(0, 0, 0, 0.3);
            --shadow-md: rgba(0, 0, 0, 0.4);
            --shadow-lg: rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-light: #3b82f6;
            --accent: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --bg-hover: #e2e8f0;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow: rgba(15, 23, 42, 0.08);
            --shadow-md: rgba(15, 23, 42, 0.12);
            --shadow-lg: rgba(15, 23, 42, 0.16);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: var(--bg-secondary);
            min-height: 100vh;
            padding: 24px;
            color: var(--text-primary);
            transition: background-color 0.2s ease, color 0.2s ease;
            line-height: 1.6;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 1px 3px var(--shadow), 0 1px 2px var(--shadow);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 32px 40px;
            position: relative;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .header-title {
            text-align: center;
            flex: 1;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 0.95rem;
            opacity: 0.9;
            font-weight: 400;
        }

        .version-badge {
            position: absolute;
            bottom: 12px;
            right: 12px;
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 12px;
            cursor: help;
            transition: all 0.2s ease;
            opacity: 0.8;
        }

        .version-badge:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.3);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 16px 6px 6px;
            border-radius: 50px;
            transition: all 0.2s ease;
        }

        .user-info:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .user-name {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .content {
            padding: 32px;
        }

        .upload-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 48px 32px;
            margin-bottom: 32px;
            border: 2px dashed var(--border);
            transition: all 0.2s ease;
        }

        .upload-section:hover {
            border-color: var(--primary);
            background: var(--bg-tertiary);
        }

        .upload-section.drag-over {
            border-color: var(--primary);
            background: var(--bg-tertiary);
            border-style: solid;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .upload-area {
            text-align: center;
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            color: var(--primary);
            opacity: 0.8;
        }

        .upload-area h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .upload-area p {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }

        .file-input {
            display: none;
        }

        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 1px 3px var(--shadow);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: 0 2px 6px var(--shadow-md);
        }

        .btn-primary:active {
            transform: translateY(1px);
            box-shadow: 0 1px 2px var(--shadow);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-success {
            background: var(--success);
            color: white;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .files-section {
            margin-top: 32px;
        }

        .files-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .search-container {
            flex: 1;
            min-width: 250px;
            max-width: 400px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 40px 10px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .clear-search {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            font-size: 1.2rem;
            display: none;
        }

        .clear-search:hover {
            color: var(--text-primary);
        }

        .clear-search.show {
            display: block;
        }

        .files-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .files-header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .view-toggle {
            display: flex;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px;
        }

        .view-toggle-btn {
            background: transparent;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .view-toggle-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .view-toggle-btn.active {
            background: var(--primary);
            color: white;
        }

        .refresh-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .refresh-btn:hover {
            background: var(--bg-hover);
        }

        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .files-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .files-table thead {
            background: var(--bg-tertiary);
        }

        .files-table th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border);
        }

        .files-table th.sortable {
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease;
        }

        .files-table th.sortable:hover {
            background: var(--bg-hover);
        }

        .files-table th.sortable::after {
            content: '';
            margin-left: 8px;
            opacity: 0.3;
        }

        .files-table th.sortable.sort-asc::after {
            content: '\25B2';
            opacity: 1;
        }

        .files-table th.sortable.sort-desc::after {
            content: '\25BC';
            opacity: 1;
        }

        .files-table td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
        }

        .files-table tbody tr {
            transition: background 0.2s ease;
        }

        .files-table tbody tr:hover {
            background: var(--bg-secondary);
        }

        .files-table tbody tr:last-child td {
            border-bottom: none;
        }

        .files-table .file-icon {
            font-size: 1.5rem;
        }

        .files-table .file-name {
            font-weight: 600;
        }

        .files-table .file-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .files-table .file-actions .btn {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .file-card {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            transition: all 0.2s ease;
        }

        .file-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 12px var(--shadow-md);
            transform: translateY(-2px);
        }

        .file-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
            color: var(--primary);
        }

        .file-name {
            font-weight: 600;
            margin-bottom: 8px;
            word-break: break-word;
            color: var(--text-primary);
        }

        .file-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .file-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .file-actions .btn {
            flex: 1;
        }

        .status-message {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .status-message.show {
            display: block;
        }

        .status-success {
            background: #dcfce7;
            border: 1px solid var(--success);
            color: #166534;
        }

        [data-theme="dark"] .status-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .status-error {
            background: #fee2e2;
            border: 1px solid var(--danger);
            color: #991b1b;
        }

        [data-theme="dark"] .status-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .status-info {
            background: #dbeafe;
            border: 1px solid var(--primary);
            color: #1e40af;
        }

        [data-theme="dark"] .status-info {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .header-top {
                flex-direction: column;
                gap: 12px;
            }

            .files-header {
                flex-direction: column;
                align-items: stretch;
            }

            .search-container {
                max-width: 100%;
                order: -1;
            }

            .user-info {
                order: -1;
            }

            .theme-toggle {
                position: absolute;
                top: 16px;
                right: 16px;
            }

            .content {
                padding: 20px;
            }

            .upload-section {
                padding: 24px;
            }

            .files-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Lightbox Styles */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            animation: fadeIn 0.3s ease;
        }

        .lightbox.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-content {
            position: relative;
            max-width: 95vw;
            max-height: 95vh;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .lightbox-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 28px;
            line-height: 40px;
            cursor: pointer;
            z-index: 10001;
            transition: all 0.2s ease;
        }

        .lightbox-close:hover {
            transform: scale(1.1);
            background: #dc2626;
        }

        .lightbox-image-container {
            position: relative;
            overflow: auto;
            max-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-tertiary);
            border-radius: 8px;
        }

        #lightboxCanvas {
            display: block;
            max-width: 100%;
            height: auto;
            cursor: crosshair;
        }

        .lightbox-info {
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
        }

        .lightbox-info h3 {
            margin: 0 0 12px 0;
            color: var(--text-primary);
            font-size: 1.1rem;
        }

        .detected-objects-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .object-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--primary);
            color: white;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .object-tag .confidence {
            opacity: 0.9;
            font-size: 0.8rem;
        }

        .object-tag .color-indicator {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 2px solid white;
        }

        .image-clickable {
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .image-clickable:hover {
            opacity: 0.8;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <div class="user-info" id="userInfo" style="visibility: hidden;">
                    <div class="user-avatar" id="userAvatar">👤</div>
                    <div class="user-name" id="userName">Loading...</div>
                </div>
                <div class="header-title">
                    <h1 id="appTitle">🗂️ MagicFiles</h1>
                    <p id="appSubtitle">Your secure cloud file manager</p>
                </div>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle dark mode">
                    🌙
                </button>
            </div>
            <div class="version-badge" id="versionBadge" title="Click for details" onclick="showVersionInfo()">
                Loading...
            </div>
        </div>

        <div class="content">
            <div id="statusMessage" class="status-message"></div>

            <div class="upload-section" id="uploadSection">
                <div class="upload-area">
                    <div class="upload-icon">📤</div>
                    <h2>Upload Files</h2>
                    <p>Drag and drop your files here, or click to browse</p>
                    <div class="file-input-wrapper">
                        <input type="file" id="fileInput" class="file-input" />
                        <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                            Choose File
                        </button>
                    </div>
                </div>
            </div>

            <div class="files-section">
                <div class="files-header">
                    <h2>My Files</h2>
                    <div class="search-container">
                        <input type="text" id="searchInput" class="search-input" placeholder="Search files..."
                            oninput="filterFiles()">
                        <span class="search-icon" id="searchIcon">🔍</span>
                        <button class="clear-search" id="clearSearch" onclick="clearSearch()"
                            title="Clear search">×</button>
                    </div>
                    <div class="files-header-actions">
                        <div class="view-toggle">
                            <button class="view-toggle-btn active" id="gridViewBtn" onclick="toggleView('grid')"
                                title="Grid View">
                                ▦
                            </button>
                            <button class="view-toggle-btn" id="tableViewBtn" onclick="toggleView('table')"
                                title="Table View">
                                ☰
                            </button>
                        </div>
                        <button class="btn refresh-btn" onclick="loadFiles()">🔄 Refresh</button>
                    </div>
                </div>

                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p>Loading files...</p>
                </div>

                <div id="filesGrid" class="files-grid"></div>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal for Image Viewing with Object Detection -->
    <div id="imageLightbox" class="lightbox" onclick="closeLightbox(event)">
        <div class="lightbox-content">
            <button class="lightbox-close" onclick="closeLightbox(event)">&times;</button>
            <div class="lightbox-image-container">
                <canvas id="lightboxCanvas"></canvas>
            </div>
            <div class="lightbox-info">
                <h3 id="lightboxFilename"></h3>
                <div id="lightboxDetectedObjects" class="detected-objects-list"></div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let files = [];
        let filteredFiles = [];
        let MAX_FILE_SIZE = 100 * 1024 * 1024; // Default 100MB in bytes
        let MAX_FILE_SIZE_MB = 100; // Default 100MB
        let currentView = 'grid'; // 'grid' or 'table'
        let currentTheme = 'auto'; // Will be set during initialization
        let searchQuery = '';
        let ALLOWED_FILE_TYPES = '*';
        let allowedExtensions = null;
        let defaultThemeMode = 'auto';
        let sortColumn = null; // 'name', 'size', or 'date'
        let sortDirection = 'asc'; // 'asc' or 'desc'
        let versionInfo = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadUserInfo();
            loadConfig();
            loadVersion();
            loadFiles();
            setupEventListeners();
        });

        // Get browser's preferred color scheme
        function getBrowserPreference() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                return 'dark';
            }
            return 'light';
        }

        // Initialize theme
        function initTheme() {
            // Check if user has a saved preference
            const savedTheme = localStorage.getItem('theme');

            if (savedTheme && savedTheme !== 'auto') {
                // User has explicitly chosen a theme
                currentTheme = savedTheme;
            } else {
                // Use auto mode (will be set to server default or 'auto')
                currentTheme = savedTheme || defaultThemeMode;
            }

            applyTheme();

            // Listen for browser theme changes when in auto mode
            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                    if (currentTheme === 'auto') {
                        applyTheme();
                    }
                });
            }
        }

        // Apply the current theme
        function applyTheme() {
            let effectiveTheme;

            if (currentTheme === 'auto') {
                effectiveTheme = getBrowserPreference();
            } else {
                effectiveTheme = currentTheme;
            }

            document.documentElement.setAttribute('data-theme', effectiveTheme);
            updateThemeIcon();
        }

        // Toggle theme (cycles through: auto → light → dark → auto)
        function toggleTheme() {
            if (currentTheme === 'auto') {
                currentTheme = 'light';
            } else if (currentTheme === 'light') {
                currentTheme = 'dark';
            } else {
                currentTheme = 'auto';
            }

            localStorage.setItem('theme', currentTheme);
            applyTheme();
        }

        // Update theme icon based on current mode
        function updateThemeIcon() {
            const themeToggle = document.getElementById('themeToggle');

            if (currentTheme === 'auto') {
                themeToggle.textContent = '🌗';
                themeToggle.title = 'Theme: Auto (following system)';
            } else if (currentTheme === 'light') {
                themeToggle.textContent = '🌙';
                themeToggle.title = 'Theme: Light';
            } else {
                themeToggle.textContent = '☀️';
                themeToggle.title = 'Theme: Dark';
            }
        }

        // Load version information
        async function loadVersion() {
            try {
                const response = await fetch('/version.json');
                versionInfo = await response.json();

                if (response.ok && versionInfo.version) {
                    const versionBadge = document.getElementById('versionBadge');
                    versionBadge.textContent = `v${versionInfo.version}`;

                    // Build tooltip
                    const buildDate = versionInfo.buildDate ? new Date(versionInfo.buildDate).toLocaleString() : 'Unknown';
                    const commit = versionInfo.commit ? versionInfo.commit.substring(0, 7) : 'local';
                    versionBadge.title = `Version: ${versionInfo.version}\nBuild: ${buildDate}\nCommit: ${commit}`;
                }
            } catch (error) {
                console.error('Error loading version:', error);
                document.getElementById('versionBadge').textContent = 'v1.0.0';
            }
        }

        // Show version info dialog
        function showVersionInfo() {
            if (!versionInfo) return;

            const buildDate = versionInfo.buildDate ? new Date(versionInfo.buildDate).toLocaleString() : 'Unknown';
            const commit = versionInfo.commit || 'local-dev';

            showStatus(
                `Version: ${versionInfo.version} | Build: ${buildDate} | Commit: ${commit}`,
                'info'
            );
        }

        // Load user information
        async function loadUserInfo() {
            try {
                const response = await fetch('/api/user');
                const userData = await response.json();

                if (response.ok && userData.name) {
                    const userInfo = document.getElementById('userInfo');
                    const userName = document.getElementById('userName');
                    const userAvatar = document.getElementById('userAvatar');

                    userName.textContent = userData.name;
                    userAvatar.textContent = userData.name.charAt(0).toUpperCase();
                    userInfo.style.visibility = 'visible';
                }
            } catch (error) {
                console.error('Error loading user info:', error);
            }
        }

        // Load configuration from server
        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();
                if (response.ok) {
                    MAX_FILE_SIZE = config.maxFileSizeBytes;
                    MAX_FILE_SIZE_MB = config.maxFileSizeMB;
                    ALLOWED_FILE_TYPES = config.allowedFileTypes;
                    allowedExtensions = config.allowedExtensions;
                    defaultThemeMode = config.defaultThemeMode || 'auto';

                    // Update app title and subtitle
                    if (config.appTitle) {
                        document.getElementById('appTitle').innerHTML = `🗂️ ${config.appTitle}`;
                        document.title = `${config.appTitle} - File Manager`;
                    }
                    if (config.appSubtitle) {
                        document.getElementById('appSubtitle').textContent = config.appSubtitle;
                    }

                    updateMaxFileSizeDisplay();
                    updateFileInputAccept();
                }
            } catch (error) {
                console.error('Error loading config:', error);
            }
        }

        // Update file input accept attribute
        function updateFileInputAccept() {
            const fileInput = document.getElementById('fileInput');
            if (allowedExtensions && allowedExtensions.length > 0) {
                fileInput.setAttribute('accept', allowedExtensions.join(','));
            } else {
                fileInput.removeAttribute('accept');
            }
        }

        // Update max file size display in UI
        function updateMaxFileSizeDisplay() {
            const uploadSection = document.querySelector('.upload-area p');
            if (uploadSection) {
                let infoText = `Drag and drop your files here, or click to browse<br><small style="color: #605e5c; font-size: 0.9em;">(Maximum file size: ${MAX_FILE_SIZE_MB}MB`;

                if (ALLOWED_FILE_TYPES !== '*') {
                    infoText += `, Allowed types: ${ALLOWED_FILE_TYPES}`;
                }

                infoText += `)</small>`;
                uploadSection.innerHTML = infoText;
            }
        }

        // Setup event listeners
        function setupEventListeners() {
            const fileInput = document.getElementById('fileInput');
            const uploadSection = document.getElementById('uploadSection');

            fileInput.addEventListener('change', handleFileSelect);

            // Drag and drop
            uploadSection.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadSection.classList.add('drag-over');
            });

            uploadSection.addEventListener('dragleave', () => {
                uploadSection.classList.remove('drag-over');
            });

            uploadSection.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadSection.classList.remove('drag-over');

                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    uploadFile(files[0]);
                }
            });
        }

        // Load files from server
        async function loadFiles() {
            showLoading(true);
            hideStatus();

            try {
                const response = await fetch('/api/files');
                const data = await response.json();

                if (response.ok) {
                    files = data.files;
                    filterFiles(); // Apply current search filter
                } else {
                    showStatus('Failed to load files: ' + data.message, 'error');
                }
            } catch (error) {
                showStatus('Error loading files: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        // Filter files based on search query
        function filterFiles() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const clearBtn = document.getElementById('clearSearch');
            const searchIcon = document.getElementById('searchIcon');

            if (searchQuery) {
                clearBtn.classList.add('show');
                searchIcon.style.display = 'none';
                filteredFiles = files.filter(file =>
                    getDisplayName(file.name).toLowerCase().includes(searchQuery) ||
                    file.name.toLowerCase().includes(searchQuery)
                );
            } else {
                clearBtn.classList.remove('show');
                searchIcon.style.display = 'block';
                filteredFiles = files;
            }

            renderFiles();
        }

        // Clear search
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            filterFiles();
        }

        // Sort table by column
        function sortTable(column) {
            if (sortColumn === column) {
                // Toggle direction if same column
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                // New column, default to ascending
                sortColumn = column;
                sortDirection = 'asc';
            }

            // Sort filteredFiles array
            filteredFiles.sort((a, b) => {
                let compareA, compareB;

                if (column === 'name') {
                    compareA = getDisplayName(a.name).toLowerCase();
                    compareB = getDisplayName(b.name).toLowerCase();
                } else if (column === 'size') {
                    compareA = a.size;
                    compareB = b.size;
                } else if (column === 'date') {
                    compareA = new Date(a.lastModified).getTime();
                    compareB = new Date(b.lastModified).getTime();
                }

                if (compareA < compareB) return sortDirection === 'asc' ? -1 : 1;
                if (compareA > compareB) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            renderFiles();
        }

        // Toggle view between grid and table
        function toggleView(view) {
            currentView = view;
            document.getElementById('gridViewBtn').classList.toggle('active', view === 'grid');
            document.getElementById('tableViewBtn').classList.toggle('active', view === 'table');
            renderFiles();
        }

        // Render files
        function renderFiles() {
            const filesContainer = document.getElementById('filesGrid');

            if (files.length === 0) {
                filesContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📂</div>
                        <h3>No files yet</h3>
                        <p>Upload your first file to get started</p>
                    </div>
                `;
                return;
            }

            if (filteredFiles.length === 0) {
                filesContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <h3>No files found</h3>
                        <p>No files match your search "${escapeHtml(searchQuery)}"</p>
                    </div>
                `;
                return;
            }

            if (currentView === 'grid') {
                renderGridView(filesContainer);
            } else {
                renderTableView(filesContainer);
            }
        }

        // Render grid view
        function renderGridView(container) {
            container.className = 'files-grid';
            container.innerHTML = filteredFiles.map((file, index) => {
                const isImage = isImageFile(file.name);
                const iconClass = isImage ? 'file-icon image-clickable' : 'file-icon';
                const iconClick = isImage ? `onclick="openImageLightbox(filteredFiles[${index}])"` : '';

                return `
                    <div class="file-card">
                        <div class="${iconClass}" ${iconClick} title="${isImage ? 'Click to view with object detection' : ''}">${getFileIcon(file.name)}</div>
                        <div class="file-name">${getDisplayName(file.name)}</div>
                        <div class="file-meta">Size: ${formatBytes(file.size)}</div>
                        <div class="file-meta">Modified: ${formatDate(file.lastModified)}</div>
                        <div class="file-meta">Uploaded by: ${escapeHtml(file.uploadedBy)}</div>
                        ${file.detectedObjects ? `<div class="file-meta" style="color: var(--success);">🎯 ${file.detectedObjects.length} object(s) detected</div>` : ''}
                        <div class="file-actions">
                            ${isImage ? `<button class="btn btn-primary" onclick="openImageLightbox(filteredFiles[${index}])" title="View with object detection">👁️ View</button>` : ''}
                            <button class="btn btn-success" onclick="downloadFile('${escapeHtml(file.name)}')">
                                ⬇️ Download
                            </button>
                            <button class="btn btn-danger" onclick="deleteFile('${escapeHtml(file.name)}')">
                                🗑️ Delete
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render table view
        function renderTableView(container) {
            container.className = '';

            const getSortClass = (column) => {
                if (sortColumn === column) {
                    return `sortable sort-${sortDirection}`;
                }
                return 'sortable';
            };

            container.innerHTML = `
                <table class="files-table">
                    <thead>
                        <tr>
                            <th style="width: 50px;"></th>
                            <th class="${getSortClass('name')}" onclick="sortTable('name')">Name</th>
                            <th class="${getSortClass('size')}" onclick="sortTable('size')" style="width: 120px;">Size</th>
                            <th class="${getSortClass('date')}" onclick="sortTable('date')" style="width: 180px;">Modified</th>
                            <th style="width: 150px;">Uploaded By</th>
                            <th style="width: 100px;">Objects</th>
                            <th style="width: 230px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filteredFiles.map((file, index) => {
                const isImage = isImageFile(file.name);
                const iconClass = isImage ? 'file-icon image-clickable' : 'file-icon';
                const iconClick = isImage ? `onclick="openImageLightbox(filteredFiles[${index}])"` : '';

                return `
                                <tr>
                                    <td><span class="${iconClass}" ${iconClick} title="${isImage ? 'Click to view with object detection' : ''}">${getFileIcon(file.name)}</span></td>
                                    <td><span class="file-name">${getDisplayName(file.name)}</span></td>
                                    <td>${formatBytes(file.size)}</td>
                                    <td>${formatDate(file.lastModified)}</td>
                                    <td>${escapeHtml(file.uploadedBy)}</td>
                                    <td>${file.detectedObjects ? `<span style="color: var(--success);">🎯 ${file.detectedObjects.length}</span>` : '-'}</td>
                                    <td>
                                        <div class="file-actions">
                                            ${isImage ? `<button class="btn btn-primary" onclick="openImageLightbox(filteredFiles[${index}])" title="View with object detection">👁️</button>` : ''}
                                            <button class="btn btn-success" onclick="downloadFile('${escapeHtml(file.name)}')">
                                                ⬇️
                                            </button>
                                            <button class="btn btn-danger" onclick="deleteFile('${escapeHtml(file.name)}')">
                                                🗑️
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            `;
            }).join('')}
                    </tbody>
                </table>
            `;
        }

        // Handle file selection
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                uploadFile(file);
            }
        }

        // Upload file
        async function uploadFile(file) {
            if (!file) return;

            // Check file type before uploading
            if (allowedExtensions && allowedExtensions.length > 0) {
                const fileExt = '.' + file.name.split('.').pop().toLowerCase();
                if (!allowedExtensions.includes(fileExt)) {
                    showStatus(
                        `File type "${fileExt}" is not allowed. Allowed types: ${ALLOWED_FILE_TYPES}`,
                        'error'
                    );
                    document.getElementById('fileInput').value = '';
                    return;
                }
            }

            // Check file size before uploading
            if (file.size > MAX_FILE_SIZE) {
                showStatus(
                    `File "${file.name}" is too large (${formatBytes(file.size)}). Maximum size is ${MAX_FILE_SIZE_MB}MB.`,
                    'error'
                );
                document.getElementById('fileInput').value = '';
                return;
            }

            showStatus('Uploading ' + file.name + '...', 'info');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus('File uploaded successfully!', 'success');
                    document.getElementById('fileInput').value = '';
                    loadFiles();
                } else {
                    showStatus('Upload failed: ' + data.message, 'error');
                }
            } catch (error) {
                showStatus('Error uploading file: ' + error.message, 'error');
            }
        }

        // Download file
        async function downloadFile(filename) {
            try {
                window.location.href = `/api/download/${encodeURIComponent(filename)}`;
                showStatus('Downloading ' + getDisplayName(filename), 'success');
            } catch (error) {
                showStatus('Error downloading file: ' + error.message, 'error');
            }
        }

        // Delete file
        async function deleteFile(filename) {
            if (!confirm('Are you sure you want to delete ' + getDisplayName(filename) + '?')) {
                return;
            }

            showStatus('Deleting file...', 'info');

            try {
                const response = await fetch(`/api/files/${encodeURIComponent(filename)}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus('File deleted successfully!', 'success');
                    loadFiles();
                } else {
                    showStatus('Delete failed: ' + data.message, 'error');
                }
            } catch (error) {
                showStatus('Error deleting file: ' + error.message, 'error');
            }
        }

        // Utility functions
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message status-${type} show`;

            setTimeout(() => {
                hideStatus();
            }, 5000);
        }

        function hideStatus() {
            const statusEl = document.getElementById('statusMessage');
            statusEl.classList.remove('show');
        }

        function showLoading(show) {
            const loadingEl = document.getElementById('loading');
            if (show) {
                loadingEl.classList.add('show');
            } else {
                loadingEl.classList.remove('show');
            }
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                'pdf': '📕',
                'doc': '📘',
                'docx': '📘',
                'xls': '📗',
                'xlsx': '📗',
                'ppt': '📙',
                'pptx': '📙',
                'jpg': '🖼️',
                'jpeg': '🖼️',
                'png': '🖼️',
                'gif': '🖼️',
                'zip': '🗜️',
                'rar': '🗜️',
                'mp3': '🎵',
                'mp4': '🎬',
                'txt': '📄',
                'csv': '📊'
            };
            return icons[ext] || '📄';
        }

        function getDisplayName(filename) {
            // Remove timestamp prefix if present
            const match = filename.match(/^\d+-(.+)$/);
            return match ? match[1] : filename;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Check if file is an image
        function isImageFile(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            return ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'].includes(ext);
        }

        // Open lightbox with image and detected objects
        function openImageLightbox(file) {
            if (!isImageFile(file.name)) return;

            const lightbox = document.getElementById('imageLightbox');
            const canvas = document.getElementById('lightboxCanvas');
            const ctx = canvas.getContext('2d');
            const filename = document.getElementById('lightboxFilename');
            const objectsList = document.getElementById('lightboxDetectedObjects');

            // Set filename
            filename.textContent = getDisplayName(file.name);

            // Load image
            const img = new Image();
            img.crossOrigin = 'anonymous';

            img.onload = function () {
                // Set canvas size to match image
                canvas.width = img.width;
                canvas.height = img.height;

                // Draw image
                ctx.drawImage(img, 0, 0);

                // Draw bounding boxes if detected objects exist
                if (file.detectedObjects && file.detectedObjects.length > 0) {
                    const colors = [
                        '#3b82f6', '#ef4444', '#10b981', '#f59e0b',
                        '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'
                    ];

                    file.detectedObjects.forEach((obj, index) => {
                        const color = colors[index % colors.length];
                        const bbox = obj.boundingBox;

                        // Draw bounding box
                        ctx.strokeStyle = color;
                        ctx.lineWidth = 3;
                        ctx.strokeRect(bbox.x, bbox.y, bbox.w, bbox.h);

                        // Draw label background
                        const label = `${obj.name} (${(obj.confidence * 100).toFixed(0)}%)`;
                        ctx.font = '16px sans-serif';
                        const textMetrics = ctx.measureText(label);
                        const textHeight = 20;

                        ctx.fillStyle = color;
                        ctx.fillRect(bbox.x, bbox.y - textHeight - 4, textMetrics.width + 12, textHeight + 4);

                        // Draw label text
                        ctx.fillStyle = 'white';
                        ctx.fillText(label, bbox.x + 6, bbox.y - 8);
                    });

                    // Display detected objects list
                    objectsList.innerHTML = file.detectedObjects.map((obj, index) => {
                        const color = colors[index % colors.length];
                        return `
                            <div class="object-tag">
                                <span class="color-indicator" style="background-color: ${color};"></span>
                                <span>${obj.name}</span>
                                <span class="confidence">${(obj.confidence * 100).toFixed(0)}%</span>
                            </div>
                        `;
                    }).join('');
                } else {
                    objectsList.innerHTML = '<p style="color: var(--text-secondary); margin: 0;">No objects detected</p>';
                }

                // Show lightbox
                lightbox.classList.add('show');
            };

            img.onerror = function () {
                showStatus('Failed to load image', 'error');
            };

            // Load image from blob URL
            img.src = file.url;
        }

        // Close lightbox
        function closeLightbox(event) {
            if (event.target === event.currentTarget || event.currentTarget.classList.contains('lightbox-close')) {
                const lightbox = document.getElementById('imageLightbox');
                lightbox.classList.remove('show');
            }
        }

        // Close lightbox on Escape key
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                const lightbox = document.getElementById('imageLightbox');
                if (lightbox.classList.contains('show')) {
                    lightbox.classList.remove('show');
                }
            }
        });
    </script>
</body>

</html>
